# Este repositorio alimenta DOIS sites Netlify separados (ver README_DEPLOY.md):
#   - igreja-sgde-sistema        -> publica a pasta app/  (area interna, login)
#   - igreja-salvador-setimo-dia -> publica a pasta site/ (site publico)
#
# Cada site define sua propria "Publish directory" direto na interface da
# Netlify (Site settings > Build & deploy). Por isso este arquivo NAO define
# [build].publish nem redirects globais aqui - isso forcaria a mesma pasta
# para os dois sites e quebraria um deles (foi o que aconteceu antes: o
# site interno estava servindo o conteudo do site publico por causa de um
# redirect generico "/* -> /index.html" definido aqui).
#
# Os redirects especificos de cada pasta ficam em arquivos _redirects
# dentro da propria pasta (site/_redirects), que so valem para o deploy
# daquele site.
