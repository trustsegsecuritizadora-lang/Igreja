<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGDE · Eventos & Campanhas</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar"></aside>
    <main class="main">
      <div class="topbar"><div><h1>Eventos & Campanhas</h1><div class="sub">O que estiver marcado "publicado" aparece no site público.</div></div></div>
      <div class="alert-area"></div>

      <div class="grid" style="grid-template-columns:1fr 1fr">
        <div class="card">
          <h2>Novo evento</h2>
          <form id="form-evento">
            <label>Título</label><input type="text" name="titulo" required>
            <label>Descrição</label><textarea name="descricao" rows="2"></textarea>
            <label>Data/hora de início</label><input type="datetime-local" name="data_inicio" required>
            <label>Local</label><input type="text" name="local">
            <label>URL da imagem (opcional)</label><input type="text" name="imagem_url">
            <label><input type="checkbox" name="inscricao_aberta" style="width:auto;display:inline-block;margin-right:6px">Abrir inscrições</label>
            <label>Limite de vagas (opcional)</label><input type="number" name="vagas_limite" min="1">
            <label><input type="checkbox" name="publicado" style="width:auto;display:inline-block;margin-right:6px">Publicar no site agora</label>
            <button type="submit" class="gold" style="margin-top:16px">Criar evento</button>
          </form>
        </div>

        <div class="card">
          <h2>Nova campanha</h2>
          <form id="form-campanha">
            <label>Título</label><input type="text" name="titulo" required>
            <label>Descrição</label><textarea name="descricao" rows="2"></textarea>
            <label>Meta (R$, opcional)</label><input type="number" step="0.01" name="meta_valor">
            <label>Data início</label><input type="date" name="data_inicio" required>
            <label>Data fim (opcional)</label><input type="date" name="data_fim">
            <label>Centro de custo vinculado</label><select name="centro_custo_id" id="sel-centro"></select>
            <label>URL da imagem (opcional)</label><input type="text" name="imagem_url">
            <label><input type="checkbox" name="publicado" style="width:auto;display:inline-block;margin-right:6px">Publicar no site agora</label>
            <button type="submit" class="gold" style="margin-top:16px">Criar campanha</button>
          </form>
        </div>
      </div>

      <div class="card">
        <h2>Eventos cadastrados</h2>
        <table id="tbl-eventos">
          <thead><tr><th>Título</th><th>Data</th><th>Inscritos</th><th>Publicado</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="card">
        <h2>Campanhas cadastradas</h2>
        <table id="tbl-campanhas">
          <thead><tr><th>Título</th><th>Meta</th><th>Arrecadado</th><th>Publicado</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script>
    let sessao;

    async function carregarCentros() {
      const { data } = await supabase.from('centros_custo').select('id_centro, nome').eq('ativo', true);
      document.getElementById('sel-centro').innerHTML = '<option value="">— nenhum —</option>' +
        (data || []).map(c => `<option value="${c.id_centro}">${c.nome}</option>`).join('');
    }

    async function alternarPublicado(tabela, campo, id, valorAtual) {
      try {
        await SGDE.comSessaoValida();
        const { error } = await supabase.from(tabela).update({ publicado: !valorAtual }).eq(campo, id);
        if (error) throw error;
        carregarTudo();
      } catch (err) { mostrarErro(err.message); }
    }
    window.alternarEvento = (id, atual) => alternarPublicado('eventos', 'id_evento', id, atual);
    window.alternarCampanha = (id, atual) => alternarPublicado('campanhas', 'id_campanha', id, atual);

    async function carregarEventos() {
      const { data } = await supabase.from('eventos')
        .select('id_evento, titulo, data_inicio, publicado').order('data_inicio', { ascending: false }).limit(30);

      const linhas = await Promise.all((data || []).map(async ev => {
        const { count } = await supabase.from('inscricoes_evento').select('id_inscricao', { count: 'exact', head: true }).eq('evento_id', ev.id_evento);
        return `<tr>
          <td>${ev.titulo}</td>
          <td>${new Date(ev.data_inicio).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}</td>
          <td>${count || 0}</td>
          <td><span class="badge ${ev.publicado ? 'conferido' : 'aberto'}">${ev.publicado ? 'sim' : 'não'}</span></td>
          <td><button class="btn ghost" onclick="alternarEvento('${ev.id_evento}', ${ev.publicado})">${ev.publicado ? 'Despublicar' : 'Publicar'}</button></td>
        </tr>`;
      }));
      document.querySelector('#tbl-eventos tbody').innerHTML = linhas.join('') || '<tr><td colspan="5">Nenhum evento.</td></tr>';
    }

    async function carregarCampanhas() {
      const { data: campanhas } = await supabase.from('campanhas')
        .select('id_campanha, titulo, meta_valor, publicado').order('data_inicio', { ascending: false }).limit(30);
      const { data: progresso } = await supabase.rpc('campanha_progresso_publica');
      const progressoPorId = Object.fromEntries((progresso || []).map(p => [p.id_campanha, p]));

      document.querySelector('#tbl-campanhas tbody').innerHTML = (campanhas || []).map(c => `
        <tr>
          <td>${c.titulo}</td>
          <td>${c.meta_valor ? formatarMoeda(c.meta_valor) : '—'}</td>
          <td>${formatarMoeda(progressoPorId[c.id_campanha]?.valor_arrecadado || 0)}</td>
          <td><span class="badge ${c.publicado ? 'conferido' : 'aberto'}">${c.publicado ? 'sim' : 'não'}</span></td>
          <td><button class="btn ghost" onclick="alternarCampanha('${c.id_campanha}', ${c.publicado})">${c.publicado ? 'Despublicar' : 'Publicar'}</button></td>
        </tr>`).join('') || '<tr><td colspan="5">Nenhuma campanha.</td></tr>';
    }

    async function carregarTudo() { await Promise.all([carregarEventos(), carregarCampanhas()]); }

    document.getElementById('form-evento').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await SGDE.comSessaoValida();
        const fd = new FormData(e.target);
        const { error } = await supabase.from('eventos').insert({
          titulo: fd.get('titulo'), descricao: fd.get('descricao') || null,
          data_inicio: fd.get('data_inicio'), local: fd.get('local') || null,
          imagem_url: fd.get('imagem_url') || null,
          inscricao_aberta: fd.get('inscricao_aberta') === 'on',
          vagas_limite: fd.get('vagas_limite') || null,
          publicado: fd.get('publicado') === 'on',
          criado_por_id: sessao.usuario_id,
        });
        if (error) throw error;
        mostrarSucesso('Evento criado.'); e.target.reset(); carregarTudo();
      } catch (err) { mostrarErro(err.message); }
    });

    document.getElementById('form-campanha').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await SGDE.comSessaoValida();
        const fd = new FormData(e.target);
        const { error } = await supabase.from('campanhas').insert({
          titulo: fd.get('titulo'), descricao: fd.get('descricao') || null,
          meta_valor: fd.get('meta_valor') || null, data_inicio: fd.get('data_inicio'),
          data_fim: fd.get('data_fim') || null, centro_custo_id: fd.get('centro_custo_id') || null,
          imagem_url: fd.get('imagem_url') || null, publicado: fd.get('publicado') === 'on',
          criado_por_id: sessao.usuario_id,
        });
        if (error) throw error;
        mostrarSucesso('Campanha criada.'); e.target.reset(); carregarTudo();
      } catch (err) { mostrarErro(err.message); }
    });

    (async function init() {
      protegerPagina();
      montarSidebar('eventos.html');
      sessao = SGDE.getSessao();
      await SGDE.comSessaoValida();
      await carregarCentros();
      await carregarTudo();
    })();
  </script>
</body>
</html>
